<svg xmlns="http://www.w3.org/2000/svg" width="800" height="534" viewBox="0 0 800 534">
  <!-- Cover of the M réso integration for Gladys Assistant (illustration, not
       the logo of M réso nor of Mobilités M). Grenoble at dusk between its
       mountains, the bubbles of the Bastille cable car, a tram on the avenue,
       and a screen of the stops announcing the next departures with a delay.
       Built into cover.jpg by scripts/build-cover.sh. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4f78b0"/>
      <stop offset="0.55" stop-color="#bcd0e8"/>
      <stop offset="1" stop-color="#f4dcc0"/>
    </linearGradient>
    <linearGradient id="tram" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7f8fa"/>
      <stop offset="1" stop-color="#cfd5dd"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a4e66"/>
      <stop offset="1" stop-color="#1d2a3a"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#141a24"/>
      <stop offset="1" stop-color="#0b0f16"/>
    </linearGradient>
  </defs>
  <rect width="800" height="534" fill="url(#sky)"/>

  <!-- the mountains around Grenoble: Vercors, Chartreuse, Belledonne -->
  <g transform="translate(0 62)">
  <path d="M0 250 L60 190 L110 210 L170 150 L230 205 L290 168 L350 215 L420 160 L470 185 L540 120 L600 175 L660 140 L720 190 L800 150 L800 300 L0 300 Z" fill="#7d93b0"/>
  <path d="M520 130 L540 120 L560 136 L548 140 Z M640 152 L660 140 L678 156 L664 158 Z M152 166 L170 150 L188 168 L170 170 Z" fill="#eef3f8"/>
  <path d="M0 280 L80 238 L150 262 L240 226 L320 258 L400 236 L470 262 L560 232 L640 260 L720 238 L800 256 L800 310 L0 310 Z" fill="#6a7f98"/>
  </g>

  <!-- the bubbles of the Bastille cable car -->
  <path d="M300 300 L700 186" stroke="#2f3a48" stroke-width="2"/>
  <path d="M300 306 L700 192" stroke="#2f3a48" stroke-width="1.5"/>
  <line x1="440" y1="260" x2="440" y2="272" stroke="#2f3a48" stroke-width="2"/>
  <circle cx="440" cy="286" r="15" fill="#e9eef3" stroke="#2f3a48" stroke-width="2"/>
  <rect x="430" y="281" width="20" height="9" rx="3" fill="#9fb6cf"/>
  <line x1="520" y1="237" x2="520" y2="249" stroke="#2f3a48" stroke-width="2"/>
  <circle cx="520" cy="263" r="15" fill="#e9eef3" stroke="#2f3a48" stroke-width="2"/>
  <rect x="510" y="258" width="20" height="9" rx="3" fill="#9fb6cf"/>
  <line x1="610" y1="212" x2="610" y2="224" stroke="#2f3a48" stroke-width="2"/>
  <circle cx="610" cy="238" r="15" fill="#e9eef3" stroke="#2f3a48" stroke-width="2"/>
  <rect x="600" y="233" width="20" height="9" rx="3" fill="#9fb6cf"/>

  <!-- the town and the avenue -->
  <path d="M0 330 L0 300 L40 300 L40 284 L90 284 L90 300 L150 300 L150 270 L200 270 L200 300 L250 300 L250 290 L330 290 L330 300 L380 300 L380 278 L430 278 L430 300 L520 300 L520 286 L590 286 L590 300 L660 300 L660 274 L720 274 L720 300 L800 300 L800 330 Z" fill="#a9b6c6"/>
  <rect x="0" y="330" width="800" height="204" fill="#8a96a5"/>
  <rect x="0" y="392" width="800" height="6" fill="#6e7987"/>
  <rect x="0" y="404" width="800" height="4" fill="#6e7987"/>

  <!-- the tram: low floor, wide windows, the blue of line A -->
  <g transform="translate(330 318)">
    <rect x="0" y="0" width="440" height="72" rx="14" fill="url(#tram)"/>
    <rect x="0" y="54" width="440" height="8" fill="#3376b8"/>
    <rect x="0" y="6" width="440" height="4" fill="#3376b8"/>
    <g fill="url(#glass)">
      <rect x="14" y="16" width="36" height="32" rx="6"/>
      <rect x="60" y="16" width="64" height="32" rx="4"/>
      <rect x="134" y="16" width="64" height="32" rx="4"/>
      <rect x="208" y="16" width="64" height="32" rx="4"/>
      <rect x="282" y="16" width="64" height="32" rx="4"/>
      <rect x="356" y="16" width="64" height="32" rx="4"/>
    </g>
    <line x1="220" y1="0" x2="240" y2="-30" stroke="#2f3a48" stroke-width="3"/>
    <line x1="240" y1="-30" x2="270" y2="-30" stroke="#2f3a48" stroke-width="3"/>
  </g>
  <line x1="0" y1="288" x2="800" y2="288" stroke="#2f3a48" stroke-width="1.5"/>

  <!-- the screen of the stop -->
  <g transform="translate(40 362)">
    <rect x="0" y="0" width="420" height="150" rx="14" fill="url(#screen)"/>
    <rect x="0" y="0" width="420" height="150" rx="14" fill="none" stroke="#3a4352" stroke-width="3"/>
    <g font-family="DejaVu Sans, Arial, sans-serif" font-weight="bold">
      <rect x="20" y="20" width="40" height="26" rx="13" fill="#3376b8"/>
      <text x="40" y="40" font-size="17" fill="#ffffff" text-anchor="middle">A</text>
      <text x="72" y="40" font-size="19" fill="#e8eef6">La Poya</text>
      <text x="400" y="40" font-size="22" fill="#ffd166" text-anchor="end">3 min</text>
      <rect x="20" y="62" width="40" height="26" rx="13" fill="#479a45"/>
      <text x="40" y="82" font-size="17" fill="#ffffff" text-anchor="middle">B</text>
      <text x="72" y="82" font-size="19" fill="#e8eef6">Oxford</text>
      <text x="400" y="82" font-size="22" fill="#ffd166" text-anchor="end">5 min</text>
      <rect x="20" y="104" width="40" height="26" rx="5" fill="#f5d24d"/>
      <text x="40" y="124" font-size="17" fill="#13263d" text-anchor="middle">C1</text>
      <text x="72" y="124" font-size="19" fill="#e8eef6">Cité Jean Macé</text>
      <text x="300" y="124" font-size="16" fill="#ff9f43">+2</text>
      <text x="400" y="124" font-size="22" fill="#ffd166" text-anchor="end">9 min</text>
    </g>
  </g>

  <!-- title -->
  <g font-family="DejaVu Sans, Arial, sans-serif">
    <text x="40" y="92" font-size="58" font-weight="bold" fill="#13263d">M réso Grenoble</text>
    <text x="42" y="136" font-size="25" fill="#1d3550">Tram &amp; bus · temps réel · retards · trafic</text>
    <text x="42" y="172" font-size="22" fill="#2a4766">pour Gladys Assistant</text>
  </g>
</svg>
